<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1379px" preserveAspectRatio="none" style="width:1016px;height:1379px;background:#FEFEFE;" version="1.1" viewBox="0 0 1016 1379" width="1016px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFEFE" height="1379" style="stroke:none;stroke-width:1;" width="1016" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Verdana" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="694.7402" x="160.0127" y="37.1182">Adding a New Patch (from upstream PR or own feature)</text></g><rect fill="#FFFFFF" height="21.876" style="stroke:#FFFFFF;stroke-width:1;" width="979.7656" x="15" y="60.0166"/><ellipse cx="128.7344" cy="96.8926" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="215.4688" x="21" y="126.8926"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="138.0762" x="31" y="148.957">Branch from dev.patch</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="167.7539" x="31" y="163.541">``git checkout dev.patch``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="195.4688" x="31" y="178.125">``git checkout -b feature/xxx``</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="214.1445" x="21.6621" y="210.6445"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="105.4805" x="31.6621" y="232.709">Develop normally</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="143.2441" x="31.6621" y="247.293">Edit files, commit freely</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="194.1445" x="31.6621" y="261.877">``npm run dev`` for hot reload</text><rect fill="#E8F0FE" height="78.3359" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="162.3125" x="47.5781" y="294.3965"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="68.4375" x="57.5781" y="316.4609">Verify build</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="142.3125" x="57.5781" y="331.0449">``npm run build:dev``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="133.2598" x="57.5781" y="345.6289">``go build ./pkg/...``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="126.9844" x="57.5781" y="360.2129">``go test ./pkg/...``</text><line style="stroke:#000000;stroke-width:1;" x1="15" x2="15" y1="60.0166" y2="1363.6326"/><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="448.6953" x="246.4688" y="436.7324"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="119.4141" x="256.4688" y="458.7969">Generate .patch file</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="428.6953" x="256.4688" y="473.3809">``git diff upstream/main...HEAD &gt; .github/patches/NNN-desc.patch``</text><rect fill="#E8F0FE" height="78.3359" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="340.0801" x="300.7764" y="505.9004"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="155.4727" x="310.7764" y="527.9648">Test patch applies cleanly</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="167.7539" x="310.7764" y="542.5488">``git checkout dev.patch``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="320.0801" x="310.7764" y="557.1328">``git checkout upstream/main -- &lt;modified files&gt;``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="233.6016" x="310.7764" y="571.7168">``git apply --check NNN-desc.patch``</text><polygon fill="#FFF9C4" points="470.8164,392.7324,482.8164,404.7324,470.8164,416.7324,458.8164,404.7324,470.8164,392.7324" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#FFF9C4" points="392.7314,604.2363,548.9014,604.2363,560.9014,624.2893,548.9014,644.3423,392.7314,644.3423,380.7314,624.2893,392.7314,604.2363" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="156.1699" x="392.7314" y="615.2954">Patch doesn't apply cleanly?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="153.5703" x="392.7314" y="628.6641">Rebase feature branch onto</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="141.8184" x="392.7314" y="642.0327">latest upstream and retry</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="560.9014" y="621.9797">yes</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="204.1367" x="368.748" y="686.0205"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="81.3809" x="378.748" y="708.085">Apply for real</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="184.1367" x="378.748" y="722.6689">``git apply NNN-desc.patch``</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="291.9629" x="324.835" y="755.1885"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="116.4785" x="334.835" y="777.2529">Verify idempotency</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="67.5293" x="334.835" y="791.8369">``git apply</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" text-decoration="line-through" textLength="45.041" x="406.583" y="791.8369">reverse</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="150.9551" x="455.8428" y="791.8369">check NNN-desc.patch``</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="136.7129" x="402.46" y="873.0408"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="116.7129" x="412.46" y="895.1052">Patch is not cleanly</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="106.3945" x="412.46" y="909.6892">reversible &#8212; fix it</text><ellipse cx="470.8164" cy="968.2087" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="470.8164" cy="968.2087" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFF9C4" points="407.4832,824.3564,534.1497,824.3564,546.1497,836.3564,534.1497,848.3564,407.4832,848.3564,395.4832,836.3564,407.4832,824.3564" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="474.8164" y="859.4155">no</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="126.6665" x="407.4832" y="840.7312">Reverse check passes?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="546.1497" y="834.0469">yes</text><line style="stroke:#000000;stroke-width:1;" x1="240.4688" x2="240.4688" y1="60.0166" y2="1363.6326"/><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="247.2207" x="736.7725" y="1021.2087"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="227.2207" x="746.7725" y="1043.2732">Add modified files to PATCHED_FILES</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="179.1738" x="746.7725" y="1057.8572">in sync-upstream-and-fix.yml</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="172.1426" x="746.7725" y="1072.4412">(new files don't need listing)</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="241.8828" x="739.4414" y="1104.9607"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="221.8828" x="749.4414" y="1127.0251">Add entry to ALREADY_INTEGRATED</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="178.9277" x="749.4414" y="1141.6091">in generate_upstream_prs.py</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="227.4746" x="746.6455" y="1174.1287"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="207.4746" x="756.6455" y="1196.1931">Update workflow commit message</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="123.7441" x="756.6455" y="1210.7771">to list the new patch</text><rect fill="#E8F0FE" height="78.3359" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="256.4375" x="732.1641" y="1243.2966"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="106.6582" x="742.1641" y="1265.3611">Commit and push</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="90.2637" x="742.1641" y="1279.9451">``git add -A``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="236.4375" x="742.1641" y="1294.5291">``git commit -m "feat: integrate ..."``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="180.9961" x="742.1641" y="1309.113">``git push origin dev.patch``</text><ellipse cx="860.3828" cy="1352.6326" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="860.3828" cy="1352.6326" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="726.1641" x2="726.1641" y1="60.0166" y2="1363.6326"/><line style="stroke:#000000;stroke-width:1;" x1="992.6016" x2="992.6016" y1="60.0166" y2="1363.6326"/><line style="stroke:#000000;stroke-width:1;" x1="128.7344" x2="128.7344" y1="106.8926" y2="126.8926"/><polygon fill="#000000" points="124.7344,116.8926,128.7344,126.8926,132.7344,116.8926,128.7344,120.8926" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="128.7344" x2="128.7344" y1="190.6445" y2="210.6445"/><polygon fill="#000000" points="124.7344,200.6445,128.7344,210.6445,132.7344,200.6445,128.7344,204.6445" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="128.7344" x2="128.7344" y1="274.3965" y2="294.3965"/><polygon fill="#000000" points="124.7344,284.3965,128.7344,294.3965,132.7344,284.3965,128.7344,288.3965" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="470.8164" x2="470.8164" y1="485.9004" y2="505.9004"/><polygon fill="#000000" points="466.8164,495.9004,470.8164,505.9004,474.8164,495.9004,470.8164,499.9004" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="470.8164" x2="470.8164" y1="416.7324" y2="436.7324"/><polygon fill="#000000" points="466.8164,426.7324,470.8164,436.7324,474.8164,426.7324,470.8164,430.7324" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="560.9014" x2="707.1641" y1="624.2893" y2="624.2893"/><polygon fill="#000000" points="703.1641,517.0109,707.1641,507.0109,711.1641,517.0109,707.1641,513.0109" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="707.1641" x2="707.1641" y1="404.7324" y2="624.2893"/><line style="stroke:#000000;stroke-width:1;" x1="707.1641" x2="482.8164" y1="404.7324" y2="404.7324"/><polygon fill="#000000" points="492.8164,400.7324,482.8164,404.7324,492.8164,408.7324,488.8164,404.7324" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="470.8164" x2="470.8164" y1="584.2363" y2="604.2363"/><polygon fill="#000000" points="466.8164,594.2363,470.8164,604.2363,474.8164,594.2363,470.8164,598.2363" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="470.8164" x2="470.8164" y1="644.3423" y2="686.0205"/><polygon fill="#000000" points="466.8164,676.0205,470.8164,686.0205,474.8164,676.0205,470.8164,680.0205" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="474.8164" y="666.2109">no</text><line style="stroke:#000000;stroke-width:1;" x1="470.8164" x2="470.8164" y1="735.1885" y2="755.1885"/><polygon fill="#000000" points="466.8164,745.1885,470.8164,755.1885,474.8164,745.1885,470.8164,749.1885" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="470.81