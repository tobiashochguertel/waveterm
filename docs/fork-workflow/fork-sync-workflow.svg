<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1196px" preserveAspectRatio="none" style="width:564px;height:1196px;background:#FEFEFE;" version="1.1" viewBox="0 0 564 1196" width="564px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFEFE" height="1196" style="stroke:none;stroke-width:1;" width="564" x="0" y="0"/><g class="title" data-source-line="10"><text fill="#000000" font-family="Verdana" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="448.3145" x="56.9932" y="37.1182">Sync Workflow: revert-then-repatch</text></g><ellipse cx="289.1445" cy="67.7373" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="210.002" x="184.1436" y="97.7373"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="94.0371" x="194.1436" y="119.8018">Fetch upstream</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="190.002" x="194.1436" y="134.3857">``git fetch upstream --tags```</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="192.2012" x="193.0439" y="166.9053"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="126.5918" x="203.0439" y="188.9697">Determine merge ref</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="154.7285" x="203.0439" y="203.5537">main &#8594; latest release tag</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="172.2012" x="203.0439" y="218.1377">dev.patch &#8594; upstream/main</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="299.5742" x="139.3574" y="250.6572"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="163.2773" x="149.3574" y="272.7217">Check if already up to date</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="279.5742" x="149.3574" y="287.3057">``git merge-base --is-ancestor $SHA HEAD``</text><rect fill="#E8F0FE" height="34.584" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="147.2832" x="215.5029" y="368.5095"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="127.2832" x="225.5029" y="390.574">Skip &#8212; nothing to do</text><ellipse cx="289.1445" cy="442.3015" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="289.1445" cy="442.3015" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFF9C4" points="234.8804,319.8252,343.4087,319.8252,355.4087,331.8252,343.4087,343.8252,234.8804,343.8252,222.8804,331.8252,234.8804,319.8252" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="293.1445" y="354.8843">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="108.5283" x="234.8804" y="336.2">Already up to date?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="355.4087" y="329.5156">no</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="311.668" x="133.3105" y="495.3015"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="286.5938" x="143.3105" y="517.366">Revert all PATCHED_FILES to upstream version</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="282.9082" x="143.3105" y="531.95">``git checkout $SHA -- &lt;each patched file&gt;``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="291.668" x="143.3105" y="546.5339">``git commit -m "chore: revert patched files"``</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="252.1309" x="163.0791" y="579.0535"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="98.4258" x="173.0791" y="601.1179">Merge upstream</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="232.1309" x="173.0791" y="615.7019">``git merge $MERGE_REF --no-edit``</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="155.7324" x="211.2783" y="696.9058"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="79.2656" x="221.2783" y="718.9702">FAIL LOUDLY</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="135.7324" x="221.2783" y="733.5542">``git merge --abort``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="64.6348" x="221.2783" y="748.1382">``exit 1``</text><ellipse cx="289.1445" cy="791.6577" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="289.1445" cy="791.6577" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFF9C4" points="244.7148,648.2214,333.5742,648.2214,345.5742,660.2214,333.5742,672.2214,244.7148,672.2214,232.7148,660.2214,244.7148,648.2214" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="293.1445" y="683.2805">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="88.8594" x="244.7148" y="664.5962">Merge conflicts?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="345.5742" y="657.9119">no</text><rect fill="#E8F0FE" height="107.5039" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="269.1816" x="154.5537" y="844.6577"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="102.4395" x="164.5537" y="866.7222">Apply all patches</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="228.3691" x="164.5537" y="881.3062">``.github/scripts/apply_patches.sh``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="121.1836" x="164.5537" y="895.8901">For each .patch file:</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="240.7441" x="172.9912" y="910.4741">- reverse check &#8594; already applied? skip</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="153.498" x="172.9912" y="925.0581">- apply check &#8594; git apply</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="133.2129" x="172.9912" y="939.6421">- else &#8594; FAIL LOUDLY</text><polygon fill="#FFF9C4" points="228.6284,972.1616,349.6606,972.1616,361.6606,984.1616,349.6606,996.1616,228.6284,996.1616,216.6284,984.1616,228.6284,972.1616" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="121.0322" x="228.6284" y="988.5364">Patch applies cleanly?</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="197.835" y="981.8521">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="361.6606" y="981.8521">no</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="277.1387" x="11" y="1006.1616"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="163.2129" x="21" y="1028.2261">Commit re-applied patches</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="164.9473" x="21" y="1042.8101">``git add frontend/ pkg/``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="257.1387" x="21" y="1057.394">``git commit -m "fix: re-apply patches"``</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="202.5313" x="48.3037" y="1089.9136"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="28.6758" x="58.3037" y="1111.978">Push</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="182.5313" x="58.3037" y="1126.562">``git push origin &lt;branch&gt;``</text><ellipse cx="149.5693" cy="1170.0815" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="149.5693" cy="1170.0815" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="241.1621" x="308.1387" y="1006.1616"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="79.2656" x="318.1387" y="1028.2261">FAIL LOUDLY</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="221.1621" x="318.1387" y="1042.8101">upstream changed surrounding code</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="64.6348" x="318.1387" y="1057.394">``exit 1``</text><ellipse cx="428.7197" cy="1100.9136" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="428.7197" cy="1100.9136" fill="#FFFFFF" rx="6" ry="6" style="stroke