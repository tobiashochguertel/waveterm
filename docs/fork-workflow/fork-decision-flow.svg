<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="993px" preserveAspectRatio="none" style="width:481px;height:993px;background:#FEFEFE;" version="1.1" viewBox="0 0 481 993" width="481px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#FEFEFE" height="993" style="stroke:none;stroke-width:1;" width="481" x="0" y="0"/><g class="title" data-source-line="8"><text fill="#000000" font-family="Verdana" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="449.7861" x="15" y="37.1182">Decision: Direct Merge vs .patch File</text></g><ellipse cx="243.9805" cy="67.7373" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#E8F0FE" height="34.584" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="231.875" x="128.043" y="97.7373"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="211.875" x="138.043" y="119.8018">Feature is stable on feature branch</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="189.5352" x="149.2129" y="152.3213"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="108.2637" x="159.2129" y="174.3857">Does it touch files</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="169.5352" x="159.2129" y="188.9697">already in PATCHED_FILES?</text><rect fill="#E8F0FE" height="78.3359" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="157.1035" x="165.4287" y="270.1736"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="131.5078" x="175.4287" y="292.238">Must use .patch file</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="137.1035" x="175.4287" y="306.822">Direct merge would be</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="116.7129" x="175.4287" y="321.406">silently reverted by</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="109.0488" x="175.4287" y="335.99">the sync workflow</text><ellipse cx="243.9805" cy="379.5095" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="243.9805" cy="379.5095" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFF9C4" points="231.9805,221.4893,255.9805,221.4893,267.9805,233.4893,255.9805,245.4893,231.9805,245.4893,219.9805,233.4893,231.9805,221.4893" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="247.9805" y="256.5483">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="234.5837" y="237.864">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="267.9805" y="231.1797">no</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="244.4258" x="121.7676" y="432.5095"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="108.2637" x="131.7676" y="454.574">Does it touch files</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="183.1289" x="131.7676" y="469.158">upstream changes frequently?</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="224.4258" x="131.7676" y="483.7419">(e.g. gotypes.d.ts, settingsconfig.go)</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="161.334" x="163.3135" y="564.9458"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="96.0938" x="173.3135" y="587.0103">Use .patch file</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="141.334" x="173.3135" y="601.5942">Avoids recurring merge</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="137.5195" x="173.3135" y="616.1782">conflicts on every sync</text><ellipse cx="243.9805" cy="659.6978" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="243.9805" cy="659.6978" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><polygon fill="#FFF9C4" points="231.9805,516.2615,255.9805,516.2615,267.9805,528.2615,255.9805,540.2615,231.9805,540.2615,219.9805,528.2615,231.9805,516.2615" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="247.9805" y="551.3206">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="234.5837" y="532.6362">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="267.9805" y="525.9519">no</text><rect fill="#E8F0FE" height="49.168" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="210.6406" x="138.6602" y="712.6978"/><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="116.8184" x="148.6602" y="734.7622">Is it a large feature</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="190.6406" x="148.6602" y="749.3462">(many files, ongoing iteration)?</text><polygon fill="#FFF9C4" points="231.9805,781.8657,255.9805,781.8657,267.9805,793.8657,255.9805,805.8657,231.9805,805.8657,219.9805,793.8657,231.9805,781.8657" style="stroke:#FBC02D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="234.5837" y="798.2405">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="18.7935" x="201.187" y="791.5562">yes</text><text fill="#000000" font-family="Verdana" font-size="11" lengthAdjust="spacing" textLength="13.6372" x="267.9805" y="791.5562">no</text><rect fill="#E8F0FE" height="63.752" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="211.2031" x="27.8647" y="815.8657"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="96.0938" x="37.8647" y="837.9302">Use .patch file</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="114.0117" x="37.8647" y="852.5142">Easier to maintain,</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="191.2031" x="37.8647" y="867.0981">regenerate from feature branch</text><ellipse cx="133.4663" cy="925.6177" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="133.4663" cy="925.6177" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><rect fill="#E8F0FE" height="107.5039" rx="12.5" ry="12.5" style="stroke:#4285F4;stroke-width:1;" width="190.8535" x="259.0679" y="815.8657"/><text fill="#000000" font-family="Verdana" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="132.7266" x="269.0679" y="837.9302">Direct merge is fine</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="142.6758" x="269.0679" y="852.5142">Small, isolated changes</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="170.8535" x="269.0679" y="867.0981">won't conflict with upstream</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="167.7539" x="269.0679" y="881.6821">``git checkout dev.patch``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="162.9375" x="269.0679" y="896.2661">``git merge feature/xxx``</text><text fill="#000000" font-family="Verdana" font-size="12" lengthAdjust="spacing" textLength="79.1484" x="269.0679" y="910.8501">``git push``</text><ellipse cx="354.4946" cy="967.6177" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="354.4946" cy="967.6177" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="243.9805" x2="243.9805" y1="77.7373" y2="97.7373"/><polygon fill="#000000" points="239.9805,87.7373,243.9805,97.7373,247.9805,87.7373,243.9805,91.7373" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="243.9805" x2="243.9805" y1="132.3213" y2="152.3213"/><polygon fill="#000000" points="239.9805,142.3213,243.9805,152.3213,247.9805,142.3213,243.9805,146.3213" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="243.9805" x2="243.9805" y1="348.5095" y2="368.5095"/><polygon fill="#000000" points="239.9805,358.5095,243.9805,368.5095,247.9805,358.5095,243.9805,362.5095" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="243.9805" x2="243.9805" y1="245.4893" y2="270.1736"/><polygon fill="#000000" points="239.9805,260.1736,243.9805,270.1736,247.9805,260.1736,243.9805,264.1736" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="267.9805" x2="332.5322" y1="233.4893" y2="233.4893"/><polygon fill="#000000" points="328.5322,324.8416,332.5322,334.8416,336.5322,324.8416,332.5322,328.8416" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit