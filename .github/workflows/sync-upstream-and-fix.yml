name: Sync Upstream & Apply Fixes

on:
  schedule:
    # Check for new upstream releases daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to merge (tag, branch, or SHA). Leave blank for auto-detect."
        required: false
        default: ""
      target_branch:
        description: "Branch to sync: main (stable, latest tag) or dev (unstable, upstream/main)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - main
          - dev
      force:
        description: "Force sync even if already up to date"
        required: false
        default: "false"
        type: boolean

# Files that carry our custom patches. These are reverted to upstream's
# version before merging, then re-applied via scripts after the merge.
# This avoids merge conflicts on these files while keeping all other
# upstream changes clean.
env:
  PATCHED_FILES: |
    frontend/app/view/term/term.tsx
    frontend/app/view/webview/webview.tsx
    frontend/app/block/block.tsx

jobs:
  # ── Stable: sync main from latest upstream release tag ────────────────────
  sync-main:
    name: Sync main (stable) ← latest upstream tag
    runs-on: ubuntu-latest
    if: github.event.inputs.target_branch != 'dev'
    permissions:
      contents: write

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: |
            .github/scripts/apply_xterm_fix.py
            .github/scripts/apply_bookmark_fix.py
            .github/scripts/apply_focus_fix.py
          cache-suffix: ${{ github.job }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/wavetermdev/waveterm.git || true
          git fetch upstream --tags --quiet

      - name: Determine upstream ref to merge
        id: upstream-ref
        run: |
          INPUT_REF="${{ github.event.inputs.upstream_ref }}"
          if [[ -n "$INPUT_REF" ]]; then
            MERGE_REF="$INPUT_REF"
          else
            # Find latest upstream release tag (vX.Y.Z, no pre-release)
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            MERGE_REF="${LATEST_TAG:-upstream/main}"
          fi
          echo "merge_ref=$MERGE_REF" >> "$GITHUB_OUTPUT"
          echo "Merging: $MERGE_REF"

      - name: Check if already up to date
        id: check-uptodate
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UPSTREAM_SHA=$(git rev-parse "refs/tags/$MERGE_REF" 2>/dev/null || git rev-parse "$MERGE_REF")

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            if [[ "${{ github.event.inputs.force }}" != "true" ]]; then
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
              echo "main already contains $MERGE_REF — nothing to do."
            else
              echo "up_to_date=false" >> "$GITHUB_OUTPUT"
              echo "Force flag set — proceeding anyway."
            fi
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits to merge into main."
          fi

      - name: Revert patched files to upstream version
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UPSTREAM_SHA=$(git rev-parse "refs/tags/$MERGE_REF" 2>/dev/null || git rev-parse "$MERGE_REF")
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "Reverting $file to upstream $MERGE_REF"
            git checkout "$UPSTREAM_SHA" -- "$file" 2>/dev/null || {
              echo "⚠️  $file not found in upstream — it may have been removed or renamed"
            }
          done <<< "$PATCHED_FILES"
          git commit -m "chore: revert patched files to upstream $MERGE_REF before merge [skip ci]" 2>/dev/null || true

      - name: Merge upstream into main
        id: merge
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          if git merge "$MERGE_REF" --no-edit \
            -m "chore: merge upstream $MERGE_REF into main [skip ci]"; then
            echo "merge_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Merge conflict detected — cannot auto-resolve"
            git merge --abort
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on merge conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "::error::Merge conflict with upstream ${{ steps.upstream-ref.outputs.merge_ref }}. Manual resolution required."
          exit 1

      - name: Re-apply xterm fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: uv run --script .github/scripts/apply_xterm_fix.py

      - name: Commit xterm fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          git add frontend/app/view/term/term.tsx
          git diff --cached --quiet || git commit -m "fix(term): disable crosshair cursor when macOptionIsMeta is enabled

          When term:macoptionismeta is set to true, xterm.js still activates
          column-select mode (crosshair cursor) on Option key hold because
          shouldColumnSelect() checks macOptionClickForcesSelection independently
          of macOptionIsMeta.

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Push updated main
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: git push origin main

      - name: Summary
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UP_TO_DATE="${{ steps.check-uptodate.outputs.up_to_date }}"
          if [[ "$UP_TO_DATE" == "true" ]]; then
            echo "## ✅ main already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "main already contains $MERGE_REF." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ main sync complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Merged: \`$MERGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Patched files reverted to upstream, then re-applied:" >> "$GITHUB_STEP_SUMMARY"
            echo "  - \`frontend/app/view/term/term.tsx\` (xterm cursor fix)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Unstable: sync dev from upstream/main + custom fixes ──────────────────
  sync-dev:
    name: Sync dev (unstable) ← upstream/main
    runs-on: ubuntu-latest
    if: github.event.inputs.target_branch != 'main'
    permissions:
      contents: write

    steps:
      - name: Checkout fork dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          cache-dependency-glob: |
            .github/scripts/apply_xterm_fix.py
            .github/scripts/apply_bookmark_fix.py
            .github/scripts/apply_focus_fix.py
          cache-suffix: ${{ github.job }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/wavetermdev/waveterm.git || true
          git fetch upstream --tags --quiet

      - name: Determine upstream ref to merge
        id: upstream-ref
        run: |
          INPUT_REF="${{ github.event.inputs.upstream_ref }}"
          if [[ -n "$INPUT_REF" ]]; then
            MERGE_REF="$INPUT_REF"
          else
            MERGE_REF="upstream/main"
          fi
          echo "merge_ref=$MERGE_REF" >> "$GITHUB_OUTPUT"
          echo "Merging: $MERGE_REF"

      - name: Check if already up to date
        id: check-uptodate
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UPSTREAM_SHA=$(git rev-parse "$MERGE_REF")

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            if [[ "${{ github.event.inputs.force }}" != "true" ]]; then
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
              echo "dev already contains $MERGE_REF — nothing to do."
            else
              echo "up_to_date=false" >> "$GITHUB_OUTPUT"
              echo "Force flag set — proceeding anyway."
            fi
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits to merge into dev."
          fi

      - name: Revert patched files to upstream version
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UPSTREAM_SHA=$(git rev-parse "$MERGE_REF")
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "Reverting $file to upstream $MERGE_REF"
            git checkout "$UPSTREAM_SHA" -- "$file" 2>/dev/null || {
              echo "⚠️  $file not found in upstream — it may have been removed or renamed"
            }
          done <<< "$PATCHED_FILES"
          git commit -m "chore: revert patched files to upstream $MERGE_REF before merge [skip ci]" 2>/dev/null || true

      - name: Merge upstream into dev
        id: merge
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          if git merge "$MERGE_REF" --no-edit \
            -m "chore: merge upstream $MERGE_REF into dev [skip ci]"; then
            echo "merge_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Merge conflict detected — cannot auto-resolve"
            git merge --abort
            echo "merge_status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on merge conflict
        if: steps.merge.outputs.merge_status == 'conflict'
        run: |
          echo "::error::Merge conflict with upstream ${{ steps.upstream-ref.outputs.merge_ref }}. Manual resolution required."
          exit 1

      - name: Re-apply xterm fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: uv run --script .github/scripts/apply_xterm_fix.py

      - name: Commit xterm fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          git add frontend/app/view/term/term.tsx
          git diff --cached --quiet || git commit -m "fix(term): disable crosshair cursor when macOptionIsMeta is enabled

          When term:macoptionismeta is set to true, xterm.js still activates
          column-select mode (crosshair cursor) on Option key hold because
          shouldColumnSelect() checks macOptionClickForcesSelection independently
          of macOptionIsMeta.

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Re-apply bookmark typeahead fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: uv run --script .github/scripts/apply_bookmark_fix.py

      - name: Commit bookmark fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          git add frontend/app/view/webview/webview.tsx
          git diff --cached --quiet || git commit -m "fix(webview): fix bookmark typeahead not rendering suggestions

          Convert fetchBookmarkSuggestions from a regular method to an arrow
          function field so \`this\` stays bound when passed as a callback to
          BlockHeaderSuggestionControl. Without this, calling the method lost
          its \`this\` binding and threw on \`this.env\`, silently rejecting the
          suggestions promise — so neither the bookmark list nor the empty
          state ever rendered when pressing Cmd+O.

          Also fix the \"Open bookmarks.json\" button path from
          presets/bookmarks.json (which nothing reads) to the correct
          bookmarks.json at the config directory root.

          Ref: wavetermdev/waveterm#3420

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Re-apply focus fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: uv run --script .github/scripts/apply_focus_fix.py

      - name: Commit focus fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          git add frontend/app/block/block.tsx
          git diff --cached --quiet || git commit -m "fix(block): stop de-focusing block from re-grabbing focus

          When clicking from one web block to another, both webviews become
          unresponsive because the de-focusing block re-grabs DOM and logical
          focus (webview-focus flap). Add guards so the de-focusing block only
          acts when it actually has focus.

          Ref: wavetermdev/waveterm#3429

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Push updated dev
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: git push origin dev

      - name: Summary
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UP_TO_DATE="${{ steps.check-uptodate.outputs.up_to_date }}"
          if [[ "$UP_TO_DATE" == "true" ]]; then
            echo "## ✅ dev already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "dev already contains $MERGE_REF." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ dev sync complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Merged: \`$MERGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Patched files reverted to upstream, then re-applied:" >> "$GITHUB_STEP_SUMMARY"
            echo "  - \`frontend/app/view/term/term.tsx\` (xterm cursor fix)" >> "$GITHUB_STEP_SUMMARY"
            echo "  - \`frontend/app/view/webview/webview.tsx\` (bookmark typeahead fix)" >> "$GITHUB_STEP_SUMMARY"
            echo "  - \`frontend/app/block/block.tsx\` (focus fix)" >> "$GITHUB_STEP_SUMMARY"
          fi
