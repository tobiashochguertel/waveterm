name: Sync Upstream & Apply Fixes

on:
  schedule:
    # Check for new upstream releases daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream ref to merge (tag, branch, or SHA). Leave blank for auto-detect."
        required: false
        default: ""
      target_branch:
        description: "Branch to sync: main (stable, latest tag) or dev (unstable, upstream/main)"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - main
          - dev
      force:
        description: "Force sync even if already up to date"
        required: false
        default: "false"
        type: boolean

jobs:
  # ── Stable: sync main from latest upstream release tag ────────────────────
  sync-main:
    name: Sync main (stable) ← latest upstream tag
    runs-on: ubuntu-latest
    if: github.event.inputs.target_branch != 'dev'
    permissions:
      contents: write

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/wavetermdev/waveterm.git || true
          git fetch upstream --tags --quiet

      - name: Determine upstream ref to merge
        id: upstream-ref
        run: |
          INPUT_REF="${{ github.event.inputs.upstream_ref }}"
          if [[ -n "$INPUT_REF" ]]; then
            MERGE_REF="$INPUT_REF"
          else
            # Find latest upstream release tag (vX.Y.Z, no pre-release)
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            MERGE_REF="${LATEST_TAG:-upstream/main}"
          fi
          echo "merge_ref=$MERGE_REF" >> "$GITHUB_OUTPUT"
          echo "Merging: $MERGE_REF"

      - name: Check if already up to date
        id: check-uptodate
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UPSTREAM_SHA=$(git rev-parse "refs/tags/$MERGE_REF" 2>/dev/null || git rev-parse "$MERGE_REF")

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            if [[ "${{ github.event.inputs.force }}" != "true" ]]; then
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
              echo "main already contains $MERGE_REF — nothing to do."
            else
              echo "up_to_date=false" >> "$GITHUB_OUTPUT"
              echo "Force flag set — proceeding anyway."
            fi
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits to merge into main."
          fi

      - name: Merge upstream ref into main
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          git merge "$MERGE_REF" \
            --no-edit \
            -m "chore: merge upstream $MERGE_REF into main [skip ci]" \
            --strategy-option=theirs 2>&1 || {
            echo "Merge failed — attempting with default strategy"
            git merge --abort 2>/dev/null || true
            git merge "$MERGE_REF" --no-edit \
              -m "chore: merge upstream $MERGE_REF into main [skip ci]"
          }

      - name: Re-apply xterm macOptionClickForcesSelection fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          TERM_TSX="frontend/app/view/term/term.tsx"
          if [[ ! -f "$TERM_TSX" ]]; then
            echo "⚠️  $TERM_TSX not found — skipping xterm fix"
            exit 0
          fi

          if grep -q "macOptionClickForcesSelection: termMacOptionIsMeta" "$TERM_TSX"; then
            echo "✅ xterm fix already present in $TERM_TSX"
            exit 0
          fi

          python3 - << 'PYEOF'
          import sys
          path = "frontend/app/view/term/term.tsx"
          with open(path) as f:
              content = f.read()
          OLD = "                macOptionIsMeta: termMacOptionIsMeta,"
          NEW = """                macOptionIsMeta: termMacOptionIsMeta,
                  // When macOptionIsMeta is enabled, also set macOptionClickForcesSelection=true.
                  // Without this, xterm.js still activates column-select mode (crosshair cursor)
                  // when holding Option, because shouldColumnSelect() checks
                  // macOptionClickForcesSelection independently of macOptionIsMeta.
                  // See: xterm.js SelectionService.ts#shouldColumnSelect()
                  macOptionClickForcesSelection: termMacOptionIsMeta,"""
          if OLD not in content:
              print(f"Pattern not found in {path} — the file structure may have changed.")
              sys.exit(1)
          patched = content.replace(OLD, NEW, 1)
          with open(path, "w") as f:
              f.write(patched)
          print(f"✅ Patched {path}")
          PYEOF

          git add "$TERM_TSX"
          git commit -m "fix(term): disable crosshair cursor when macOptionIsMeta is enabled

          When term:macoptionismeta is set to true, xterm.js still activates
          column-select mode (crosshair cursor) on Option key hold because
          shouldColumnSelect() checks macOptionClickForcesSelection independently
          of macOptionIsMeta.

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Push updated main
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          git push origin main

      - name: Create summary
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UP_TO_DATE="${{ steps.check-uptodate.outputs.up_to_date }}"
          if [[ "$UP_TO_DATE" == "true" ]]; then
            echo "## ✅ main already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "main already contains $MERGE_REF." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ main sync complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Merged: \`$MERGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- xterm macOptionClickForcesSelection fix re-applied" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Unstable: sync dev from upstream/main + custom fixes ──────────────────
  sync-dev:
    name: Sync dev (unstable) ← upstream/main
    runs-on: ubuntu-latest
    if: github.event.inputs.target_branch != 'main'
    permissions:
      contents: write

    steps:
      - name: Checkout fork dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/wavetermdev/waveterm.git || true
          git fetch upstream --tags --quiet

      - name: Determine upstream ref to merge
        id: upstream-ref
        run: |
          INPUT_REF="${{ github.event.inputs.upstream_ref }}"
          if [[ -n "$INPUT_REF" ]]; then
            MERGE_REF="$INPUT_REF"
          else
            MERGE_REF="upstream/main"
          fi
          echo "merge_ref=$MERGE_REF" >> "$GITHUB_OUTPUT"
          echo "Merging: $MERGE_REF"

      - name: Check if already up to date
        id: check-uptodate
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UPSTREAM_SHA=$(git rev-parse "$MERGE_REF")

          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            if [[ "${{ github.event.inputs.force }}" != "true" ]]; then
              echo "up_to_date=true" >> "$GITHUB_OUTPUT"
              echo "dev already contains $MERGE_REF — nothing to do."
            else
              echo "up_to_date=false" >> "$GITHUB_OUTPUT"
              echo "Force flag set — proceeding anyway."
            fi
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits to merge into dev."
          fi

      - name: Merge upstream/main into dev
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          git merge "$MERGE_REF" \
            --no-edit \
            -m "chore: merge upstream $MERGE_REF into dev [skip ci]" \
            --strategy-option=theirs 2>&1 || {
            echo "Merge failed — attempting with default strategy"
            git merge --abort 2>/dev/null || true
            git merge "$MERGE_REF" --no-edit \
              -m "chore: merge upstream $MERGE_REF into dev [skip ci]"
          }

      - name: Re-apply xterm macOptionClickForcesSelection fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          TERM_TSX="frontend/app/view/term/term.tsx"
          if [[ ! -f "$TERM_TSX" ]]; then
            echo "⚠️  $TERM_TSX not found — skipping xterm fix"
            exit 0
          fi

          if grep -q "macOptionClickForcesSelection: termMacOptionIsMeta" "$TERM_TSX"; then
            echo "✅ xterm fix already present in $TERM_TSX"
            exit 0
          fi

          python3 - << 'PYEOF'
          import sys
          path = "frontend/app/view/term/term.tsx"
          with open(path) as f:
              content = f.read()
          OLD = "                macOptionIsMeta: termMacOptionIsMeta,"
          NEW = """                macOptionIsMeta: termMacOptionIsMeta,
                  // When macOptionIsMeta is enabled, also set macOptionClickForcesSelection=true.
                  // Without this, xterm.js still activates column-select mode (crosshair cursor)
                  // when holding Option, because shouldColumnSelect() checks
                  // macOptionClickForcesSelection independently of macOptionIsMeta.
                  // See: xterm.js SelectionService.ts#shouldColumnSelect()
                  macOptionClickForcesSelection: termMacOptionIsMeta,"""
          if OLD not in content:
              print(f"Pattern not found in {path} — the file structure may have changed.")
              sys.exit(1)
          patched = content.replace(OLD, NEW, 1)
          with open(path, "w") as f:
              f.write(patched)
          print(f"✅ Patched {path}")
          PYEOF

          git add "$TERM_TSX"
          git commit -m "fix(term): disable crosshair cursor when macOptionIsMeta is enabled

          When term:macoptionismeta is set to true, xterm.js still activates
          column-select mode (crosshair cursor) on Option key hold because
          shouldColumnSelect() checks macOptionClickForcesSelection independently
          of macOptionIsMeta.

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Re-apply bookmark typeahead fix
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          WEBVIEW_TSX="frontend/app/view/webview/webview.tsx"
          if [[ ! -f "$WEBVIEW_TSX" ]]; then
            echo "⚠️  $WEBVIEW_TSX not found — skipping bookmark fix"
            exit 0
          fi

          if grep -q "fetchBookmarkSuggestions = async" "$WEBVIEW_TSX"; then
            echo "✅ bookmark fix already present in $WEBVIEW_TSX"
            exit 0
          fi

          python3 - << 'PYEOF'
          import sys
          path = "frontend/app/view/webview/webview.tsx"
          with open(path) as f:
              content = f.read()

          # Fix 1: Convert method to arrow function field
          OLD_METHOD = """    async fetchBookmarkSuggestions(
        query: string,
        reqContext: SuggestionRequestContext
    ): Promise<FetchSuggestionsResponse> {"""
          NEW_ARROW = """    fetchBookmarkSuggestions = async (
        query: string,
        reqContext: SuggestionRequestContext
    ): Promise<FetchSuggestionsResponse> => {"""
          if OLD_METHOD not in content:
              print("fetchBookmarkSuggestions method pattern not found — may already be fixed or file structure changed.")
              sys.exit(1)
          content = content.replace(OLD_METHOD, NEW_ARROW, 1)

          # Fix 2: Close the arrow function with semicolon
          OLD_RETURN = """        return result;
    }

    handleUrlWrapperMouseOver"""
          NEW_RETURN = """        return result;
    };

    handleUrlWrapperMouseOver"""
          if OLD_RETURN not in content:
              print("Closing brace pattern not found — may already be fixed.")
              sys.exit(1)
          content = content.replace(OLD_RETURN, NEW_RETURN, 1)

          # Fix 3: Fix bookmarks.json path
          OLD_PATH = "${env.electron.getConfigDir()}/presets/bookmarks.json"
          NEW_PATH = "${env.electron.getConfigDir()}/bookmarks.json"
          content = content.replace(OLD_PATH, NEW_PATH)

          with open(path, "w") as f:
              f.write(content)
          print(f"✅ Patched {path}")
          PYEOF

          git add "$WEBVIEW_TSX"
          git commit -m "fix(webview): fix bookmark typeahead not rendering suggestions

          Convert fetchBookmarkSuggestions from a regular method to an arrow
          function field so \`this\` stays bound when passed as a callback to
          BlockHeaderSuggestionControl. Without this, calling the method lost
          its \`this\` binding and threw on \`this.env\`, silently rejecting the
          suggestions promise — so neither the bookmark list nor the empty
          state ever rendered when pressing Cmd+O.

          Also fix the \"Open bookmarks.json\" button path from
          presets/bookmarks.json (which nothing reads) to the correct
          bookmarks.json at the config directory root.

          Ref: wavetermdev/waveterm#3420

          Co-authored-by: Tobias Hochgürtel <tobias.hochguertel@googlemail.com>
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      - name: Push updated dev
        if: steps.check-uptodate.outputs.up_to_date != 'true'
        run: |
          git push origin dev

      - name: Create summary
        run: |
          MERGE_REF="${{ steps.upstream-ref.outputs.merge_ref }}"
          UP_TO_DATE="${{ steps.check-uptodate.outputs.up_to_date }}"
          if [[ "$UP_TO_DATE" == "true" ]]; then
            echo "## ✅ dev already up to date" >> "$GITHUB_STEP_SUMMARY"
            echo "dev already contains $MERGE_REF." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ dev sync complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Merged: \`$MERGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- xterm macOptionClickForcesSelection fix re-applied" >> "$GITHUB_STEP_SUMMARY"
            echo "- bookmark typeahead fix re-applied" >> "$GITHUB_STEP_SUMMARY"
          fi
